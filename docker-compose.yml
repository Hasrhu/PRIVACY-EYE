services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     privacyeye
      POSTGRES_PASSWORD: password
      POSTGRES_DB:       privacyeye_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U privacyeye"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ── FastAPI Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL:     postgresql+asyncpg://privacyeye:password@db:5432/privacyeye_db
      DATABASE_URL_SYNC: postgresql://privacyeye:password@db:5432/privacyeye_db
      APP_ENV:          development
      APP_SECRET_KEY:   change-me-in-production-32-chars-min
      JWT_SECRET_KEY:   change-me-jwt-32-chars-min-dev-key
      GEMINI_API_KEY:   ${GEMINI_API_KEY:-}
      ML_DEVICE:        cpu
    volumes:
      - ./backend:/app
      - ml_weights:/app/../ml/weights
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # ── Next.js Frontend ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
  ml_weights:
